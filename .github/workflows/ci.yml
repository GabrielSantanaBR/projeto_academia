name: Verificação do produto
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: movimento
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: movimento_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://movimento:ci-only-password@localhost:5432/movimento_test
      TEST_DATABASE_URL: postgresql://movimento:ci-only-password@localhost:5432/movimento_test
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-test-secret-never-use-in-production-123456
      NEXT_TELEMETRY_DISABLED: '1'
      DEMO_MODE: 'false'
      ALLOW_DEMO_SEED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: |
            playwright-report/
            test-results/
          retention-days: 7
