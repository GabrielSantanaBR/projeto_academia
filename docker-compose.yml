services:
  postgres:
    image: postgres:16-alpine
    container_name: movimento-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: movimento
      POSTGRES_USER: movimento
      POSTGRES_PASSWORD: movimento
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movimento -d movimento"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
