# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: movimento-academia
    runtime: node
    region: virginia
    plan: starter
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "false"
      - key: ALLOW_DEMO_SEED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: movimento-db
          property: connectionString

databases:
  - name: movimento-db
    region: virginia
    plan: basic-256mb
    databaseName: movimento
    user: movimento
    postgresMajorVersion: "16"
    ipAllowList: []
